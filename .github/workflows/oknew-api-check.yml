name: OKNEW backend checks

on:
  push:
    branches:
      - feature/oknew-accounts-postgres
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check server/index.js
          node --check auth-client.js
          node --check app.js
      - name: Validate package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('server/package.json', 'utf8')); console.log('package.json valid')"
