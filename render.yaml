services:
  - type: web
    name: oknew-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oknew-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://codelab-i7hd.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_REPLY_TO
        sync: false

databases:
  # Free Postgres is temporary (expires after 30 days); do not use for permanent user progress.
  - name: oknew-postgres
    databaseName: oknew
    user: oknew
    plan: free
